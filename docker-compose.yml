services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./config/production.env
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - practicum-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${PGUSER} -d $${PGDATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ./websocket-runner-demo
      dockerfile: Dockerfile
    container_name: runner
    restart: unless-stopped
    env_file:
      - ./config/production.env
    environment:
      PORT: 4000
      NODE_ENV: production
      RUNNER_API_KEY: ${RUNNER_API_KEY}
      EXECUTION_TIMEOUT_MS: ${EXECUTION_TIMEOUT_MS}
      IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    networks:
      - practicum-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-evaluator:
    build:
      context: ./ai_evaluator_service
      dockerfile: Dockerfile
    container_name: ai-evaluator
    restart: unless-stopped
    env_file:
      - ./config/production.env
    environment:
      PORT: 5000
      NODE_ENV: production
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER}
      MINDROUTER_API_KEY: ${MINDROUTER_API_KEY}
      MINDROUTER_MODEL: ${MINDROUTER_MODEL}
      MINDROUTER_BASE_URL: ${MINDROUTER_BASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AI_TEMPERATURE: 0.1
      AI_CONTEXT_LENGTH: 4096
      AI_REQUEST_TIMEOUT_MS: 300000
      AI_MAX_CONCURRENT_REQUESTS: 1
      AI_MAX_RETRIES: 2
      LMS_WEBHOOK_URL: http://backend:3000/api/internal/ai-callback
    networks:
      - practicum-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./be_platform_praktikum
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./config/production.env
    environment:
      PORT: 3000
      NODE_ENV: production
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_EXPIRES_IN: ${AUTH_TOKEN_EXPIRES_IN}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PGSSL: "false"
      INTERACTIVE_RUNNER_WS_URL: ws://runner:4000/ws
      RUNNER_API_KEY: ${RUNNER_API_KEY}
      AI_EVALUATOR_SERVICE_URL: http://ai-evaluator:5000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      LMS_WEBHOOK_URL: http://backend:3000/api/internal/ai-callback
      AI_EVALUATION_MAX_RETRY: 3
      AI_EVALUATION_RETRY_DELAY_MS: 1500
      AI_EVALUATOR_DEBUG_PAYLOAD: "false"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      LIVE_WORKSPACE_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
      ai-evaluator:
        condition: service_healthy
    networks:
      - practicum-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./fe_platform_praktikum
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: frontend
    restart: unless-stopped
    networks:
      - practicum-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - practicum-network

networks:
  practicum-network:
    driver: bridge

volumes:
  postgres_data:
